services:
  postgres:
    image: postgres:15
    container_name: talentpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-warehouse}
    # Tuned for a 4GB VPS shared with metabase/prefect/tp-backend. dbt runs its
    # heaviest queries here (from the GHA runners over tailnet), so work_mem is
    # the knob that matters most after shared_buffers.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${DB_NAME:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 1G

  metabase:
    image: metabase/metabase:v0.50.20
    container_name: talentpulse-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-password}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
      # Cap the JVM heap. Without -Xmx the JVM sizes its heap from the *host's*
      # total RAM, not the container limit, and gets OOM-killed on a 4GB box.
      # 768m heap + ~250m non-heap (metaspace/threads/direct) fits the 1G limit.
      JAVA_OPTS: -Xmx768m -Xms256m -XX:+UseSerialGC
    ports:
      - "3000:3000"
    volumes:
      - metabase_plugins:/plugins
    restart: unless-stopped
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 1G

  prefect-server:
    image: prefecthq/prefect:2.16.5-python3.10
    container_name: talentpulse-prefect-server
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-https://perfect.talentpuse.io.vn/api}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${POSTGRES_USER:-admin}:${DB_PASSWORD_ENCODED:-password}@postgres:5432/prefect"
    depends_on:
      postgres:
        condition: service_healthy
    # Prefect 2 OSS has NO authentication. Bind to loopback only: CI reaches it
    # via `tailscale serve --tcp=4200`, humans via the reverse proxy / SSH tunnel.
    # Publishing 0.0.0.0:4200 puts an unauthenticated flow-run API on the public
    # internet. See docs/gha-migration-runbook.md (b)(4).
    ports:
      - "127.0.0.1:4200:4200"
    restart: unless-stopped
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  talentpulse:
    name: talentpulse
    driver: bridge

volumes:
  pgdata:
  metabase_plugins:

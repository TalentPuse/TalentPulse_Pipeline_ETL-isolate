services:
  postgres:
    image: postgres:15
    container_name: talentpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-warehouse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${DB_NAME:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 1G

  metabase:
    image: metabase/metabase:v0.50.20
    container_name: talentpulse-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-password}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"
    volumes:
      - metabase_plugins:/plugins
    restart: unless-stopped
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 1536M

  prefect-server:
    image: prefecthq/prefect:2.16.5-python3.10
    container_name: talentpulse-prefect-server
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-https://perfect.talentpuse.io.vn/api}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${POSTGRES_USER:-admin}:${DB_PASSWORD_ENCODED:-password}@postgres:5432/prefect"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
    restart: unless-stopped
    networks:
      - talentpulse
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  talentpulse:
    name: talentpulse
    driver: bridge

volumes:
  pgdata:
  metabase_plugins:

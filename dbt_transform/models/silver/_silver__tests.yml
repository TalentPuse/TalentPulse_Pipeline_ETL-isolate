version: 2

models:
  - name: silver_job_detail
    description: "Normalized job_detail with VND-monthly salary + canonical city/degree/size labels. Grain is (source, source_job_id)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, source_job_id]
    columns:
      - name: source_job_id
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: company_name
        tests: [not_null]
      - name: city_canonical
        description: >
          Canonical city, resolved by exact alias then by substring against
          city_map. NULL is a legitimate outcome, not a defect: 217 LinkedIn rows
          carry city_raw_en = 'Vietnam', which names no city to resolve. Hence no
          not_null test — use the drift query in docs/data_audit.md to watch the
          unmatched set instead.
      - name: job_level
        description: "Canonical job level, derived from title when raw is missing/unreliable. Never NULL — defaults to Mid-level."
        tests:
          - not_null
          - accepted_values:
              values: ['Intern/Student', 'Fresher/Entry level', 'Mid-level', 'Senior',
                       'Manager', 'Director+']
      - name: job_category
        description: >
          Standardized job category. Resolution order: VietnamWorks job_function
          (for the three functions marked beats_title) -> title keyword seed ->
          the rest of the VietnamWorks function taxonomy -> normalization engine
          -> 'Other'. Never NULL. Note the non-tech values: keyword searches drag
          in Marketing/HR/Accounting/etc roles, and labelling them beats dumping
          them all into 'Other', which then stops meaning anything.
        tests:
          - not_null
          - accepted_values:
              # Defined once in dbt_project.yml (vars.job_categories) and shared
              # with _gold__tests.yml — the two inline copies had already drifted.
              values: "{{ var('job_categories') }}"
      - name: salary_vnd_monthly_avg
        description: "Avg of min/max in VND monthly. Sanity bounds: 1M to 5B/month."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1000000
              max_value: 5000000000
              config:
                where: "salary_vnd_monthly_avg is not null"

  - name: silver_skill_long
    description: "One row per (job, skill). VNW skill_id retained, canonical name TBD."
    columns:
      - name: skill_name_norm
        tests: [not_null]
      - name: skill_weight
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  - name: silver_company_dim
    description: "Company dimension, deduped by company_id with aggregated job counts."
    columns:
      - name: company_id
        tests: [not_null, unique]
      - name: company_name
        tests: [not_null]
      - name: n_active_jobs
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

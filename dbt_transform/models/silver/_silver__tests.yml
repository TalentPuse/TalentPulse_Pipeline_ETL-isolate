version: 2

models:
  - name: silver_job_detail
    description: "Normalized job_detail with VND-monthly salary + canonical city/degree/size labels."
    columns:
      - name: source_job_id
        tests: [not_null, unique]
      - name: title
        tests: [not_null]
      - name: company_name
        tests: [not_null]
      - name: city_canonical
        description: "Canonical city. NULL means city_raw_en didn't match city_map (drift detector)."
        tests:
          - not_null:
              config:
                where: "city_raw_en is not null"
      - name: job_level
        description: "Canonical job level, derived from title when raw is missing/unreliable. Never NULL — defaults to Mid-level."
        tests:
          - not_null
          - accepted_values:
              values: ['Intern/Student', 'Fresher/Entry level', 'Mid-level', 'Senior',
                       'Manager', 'Director+']
      - name: job_category
        description: >
          Standardized job category. Resolution order: VietnamWorks job_function
          (for the three functions marked beats_title) -> title keyword seed ->
          the rest of the VietnamWorks function taxonomy -> normalization engine
          -> 'Other'. Never NULL. Note the non-tech values: keyword searches drag
          in Marketing/HR/Accounting/etc roles, and labelling them beats dumping
          them all into 'Other', which then stops meaning anything.
        tests:
          - not_null
          - accepted_values:
              values: [# engineering / data
                       'AI Engineer', 'MLOps Engineer', 'Backend Developer',
                       'Frontend Developer', 'Fullstack Developer', 'Software Engineer',
                       'Data Engineer', 'Data Analyst', 'Data Scientist', 'Data Management',
                       'QA Engineer', 'DevOps Engineer', 'Cloud Engineer', 'System Engineer',
                       'Network Engineer', 'Cyber Security', 'Embedded Engineer',
                       'Mobile Developer', 'Solution Architect', 'Database Administrator',
                       'Bridge Engineer', 'Technical Lead', 'Technical Support',
                       'Game Developer',
                       # product / delivery
                       'UX Designer', 'Product Manager', 'Project Manager', 'ERP Consultant',
                       'Business Analyst', 'Research & Development',
                       # commercial
                       'Technical Sales', 'Business Development', 'Sales Operations',
                       'Account Manager', 'Channel Sales', 'Presales Engineer',
                       'Supply Chain Analyst', 'Real Estate',
                       # non-tech roles the keyword searches pull in
                       'Marketing', 'Human Resources', 'Accounting & Finance',
                       'Creative Design', 'Customer Service', 'Supply Chain & Logistics',
                       'Manufacturing & Engineering', 'Healthcare & Life Sciences',
                       'Education & Training', 'Legal & Compliance', 'Administration',
                       'General Management',
                       'Other']
      - name: salary_vnd_monthly_avg
        description: "Avg of min/max in VND monthly. Sanity bounds: 1M to 5B/month."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1000000
              max_value: 5000000000
              config:
                where: "salary_vnd_monthly_avg is not null"

  - name: silver_skill_long
    description: "One row per (job, skill). VNW skill_id retained, canonical name TBD."
    columns:
      - name: skill_name_norm
        tests: [not_null]
      - name: skill_weight
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  - name: silver_company_dim
    description: "Company dimension, deduped by company_id with aggregated job counts."
    columns:
      - name: company_id
        tests: [not_null, unique]
      - name: company_name
        tests: [not_null]
      - name: n_active_jobs
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

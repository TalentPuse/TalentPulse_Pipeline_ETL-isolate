name: talentpulse
version: '1.0.0'
config-version: 2

profile: talentpulse

vars:
  # How long a posting stays "active" when its source publishes no expiry date.
  # Only LinkedIn needs this today (it never sends expired_at); VietnamWorks,
  # ITviec and TopCV all supply one and are unaffected. See bronze/stg_job_detail.
  job_stale_days: 45

  # Single source of truth for the accepted_values test on job_category, used by
  # BOTH _silver__tests.yml and _gold__tests.yml. It lived inline in each file and
  # promptly drifted: silver was extended for the new categories while gold kept
  # the old 27, so `dbt test` failed on gold only — and nobody saw it, because the
  # pipeline runs `dbt seed` + `dbt run` and never `dbt test`.
  # Adding a category to a seed means adding it here, once.
  job_categories:
    # engineering / data
    - AI Engineer
    - MLOps Engineer
    - Backend Developer
    - Frontend Developer
    - Fullstack Developer
    - Software Engineer
    - Game Developer
    - Data Engineer
    - Data Analyst
    - Data Scientist
    - Data Management
    - QA Engineer
    - DevOps Engineer
    - Cloud Engineer
    - System Engineer
    - Network Engineer
    - Cyber Security
    - Embedded Engineer
    - Mobile Developer
    - Solution Architect
    - Database Administrator
    - Bridge Engineer
    - Technical Lead
    - Technical Support
    # product / delivery
    - UX Designer
    - Product Manager
    - Project Manager
    - ERP Consultant
    - Business Analyst
    - Research & Development
    # commercial
    - Technical Sales
    - Business Development
    - Sales Operations
    - Account Manager
    - Channel Sales
    - Presales Engineer
    - Supply Chain Analyst
    - Real Estate
    # non-tech roles the keyword searches pull in
    - Marketing
    - Human Resources
    - Accounting & Finance
    - Creative Design
    - Customer Service
    - Supply Chain & Logistics
    - Manufacturing & Engineering
    - Healthcare & Life Sciences
    - Education & Training
    - Legal & Compliance
    - Administration
    - General Management
    - Other

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Build layered schemas so dbt models don't clash with raw.*
models:
  talentpulse:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    features:
      +materialized: table
      +schema: feature

seeds:
  talentpulse:
    +schema: seeds
    job_title_category_map:
      +column_types:
        priority: integer
    vnw_function_category_map:
      +column_types:
        beats_title: boolean

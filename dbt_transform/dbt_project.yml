name: talentpulse
version: '1.0.0'
config-version: 2

profile: talentpulse

vars:
  # How long a posting stays "active" when its source publishes no expiry date.
  # Only LinkedIn needs this today (it never sends expired_at); VietnamWorks,
  # ITviec and TopCV all supply one and are unaffected. See bronze/stg_job_detail.
  job_stale_days: 45

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Build layered schemas so dbt models don't clash with raw.*
models:
  talentpulse:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    features:
      +materialized: table
      +schema: feature

seeds:
  talentpulse:
    +schema: seeds
    job_title_category_map:
      +column_types:
        priority: integer
    vnw_function_category_map:
      +column_types:
        beats_title: boolean

name: talentpulse
version: '1.0.0'
config-version: 2

profile: talentpulse

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Build layered schemas so dbt models don't clash with raw.*
models:
  talentpulse:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    features:
      +materialized: table
      +schema: feature

seeds:
  talentpulse:
    +schema: seeds

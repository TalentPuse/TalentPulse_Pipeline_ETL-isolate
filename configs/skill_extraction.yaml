# ─── LLM Config ───
llm:
  api_key_env: "OPENAI_API_KEY"            # env var name
  model: "deepseek/deepseek-v4-flash"      # flash for batch (cheap + fast)
  base_url: "https://openrouter.ai/api/v1"
  max_concurrent: 5                         # parallel requests
  batch_size: 50                            # jobs per batch
  timeout: 60                               # seconds per request
  max_text_length: 3000                     # truncate description to this

# ─── Source Config ───
source:
  schema: "dbt_dev_silver"
  table: "silver_job_detail"
  text_fields:
    - "job_description_text"
    - "job_requirement_text"
  id_fields:
    - "source"
    - "source_job_id"

# ─── Output Config ───
output:
  log_table: "raw.skill_extraction_log"


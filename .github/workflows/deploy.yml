name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: talentpulse-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image_suffix: worker
            dockerfile: orchestration/Dockerfile.worker
          - image_suffix: telegram
            dockerfile: docker/Dockerfile.telegram

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: [self-hosted, Linux, X64, talentpulse_pa]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime .env
        run: |
          echo "Working directory: $(pwd)"
          rm -f .env

          DB_PASS_ENCODED=$(python3 -c "from urllib.parse import quote_plus; print(quote_plus('${{ secrets.POSTGRES_PASSWORD }}'))")
          MINIO_PASS_ENCODED=$(python3 -c "from urllib.parse import quote_plus; print(quote_plus('${{ secrets.MINIO_ROOT_PASSWORD }}'))")

          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD_ENCODED=${DB_PASS_ENCODED}
          DB_NAME=${{ vars.DB_NAME || 'warehouse' }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_ENDPOINT_URL=http://minio:9000
          S3_ACCESS_KEY=${{ secrets.MINIO_ROOT_USER }}
          S3_SECRET_KEY=${MINIO_PASS_ENCODED}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME || 'talentpulse-raw' }}
          PREFECT_UI_API_URL=${{ secrets.PREFECT_UI_API_URL || 'http://localhost:4200/api' }}
          CRAWLER_CONTACT_EMAIL=${{ secrets.CRAWLER_CONTACT_EMAIL || 'contact@example.com' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          EOF

          if [ ! -f .env ]; then
            echo "Failed to create .env"
            exit 1
          fi
          echo ".env created successfully"

      - name: Deploy with Docker Compose
        run: |
          export REGISTRY=${{ env.REGISTRY }}
          export IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG=sha-${{ github.sha }}
          export IMAGE_TAG_FALLBACK=${{ github.ref_name }}

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull custom images
          for suffix in worker telegram; do
            if ! docker pull ${REGISTRY}/${IMAGE_NAME}-${suffix}:${IMAGE_TAG}; then
              echo "Fallback to ${IMAGE_TAG_FALLBACK} for ${suffix}"
              export IMAGE_TAG=${IMAGE_TAG_FALLBACK}
              docker pull ${REGISTRY}/${IMAGE_NAME}-${suffix}:${IMAGE_TAG}
            fi
          done

          docker compose up -d
          docker image prune -f

          echo "Deployment successful!"
          docker compose ps

name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: talentpulse-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image_suffix: worker
            dockerfile: orchestration/Dockerfile.worker
          - image_suffix: itviec
            dockerfile: orchestration/Dockerfile.worker.itviec
          - image_suffix: linkedin
            dockerfile: orchestration/Dockerfile.worker.linkedin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: [self-hosted, Linux, X64, talentpulse_pa]
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime .env
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME || 'warehouse' }}
          PREFECT_UI_API_URL: ${{ secrets.PREFECT_UI_API_URL || 'http://localhost:4200/api' }}
        run: |
          DB_PASS_ENCODED=$(python3 -c "from urllib.parse import quote_plus; import os; print(quote_plus(os.environ['POSTGRES_PASSWORD']))")

          rm -f .env
          echo "POSTGRES_USER=${POSTGRES_USER}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "DB_PASSWORD_ENCODED=${DB_PASS_ENCODED}" >> .env
          echo "DB_NAME=${DB_NAME}" >> .env
          echo "PREFECT_UI_API_URL=${PREFECT_UI_API_URL}" >> .env

          echo ".env created successfully"

      # NOTE: no worker/itviec/linkedin image pull here anymore - those
      # compute images are now only consumed by the pipeline-*.yml GHA cron
      # workflows (docker run over Tailscale), not by anything running on
      # the VPS. build-and-push (above) still builds+pushes them so those
      # workflows have something to pull.
      - name: Deploy with Docker Compose
        run: |
          # No GHCR login needed here: postgres/prefect-server/metabase are
          # all public Docker Hub images. --remove-orphans tears down any previously-running
          # prefect-worker/alert-worker/itviec-worker/linkedin-worker/minio
          # containers left over from before this migration.
          docker compose up -d --remove-orphans
          docker image prune -f

          echo "Deployment successful!"
          docker compose ps

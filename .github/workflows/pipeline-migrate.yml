name: Pipeline - Migrate & Seed

# Manual/on-demand only: applies scripts/migrate_*.sql against the VPS
# Postgres warehouse and seeds normalization rules. Replaces the old
# deploy-time steps in deploy.yml that used to `docker exec` into the
# talentpulse-prefect-worker container - that container no longer exists
# now that compute moved to GitHub Actions (see docker-compose.yml).
#
# Run this manually after a schema change lands (new migrate_*.sql file) or
# right after the initial cutover, then rely on pipeline-*.yml crons for
# day-to-day runs. Uncomment the schedule block below if you want it to also
# run automatically (e.g. nightly, idempotent SQL/seed so reruns are safe).
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "30 1 * * *"

concurrency:
  group: pipeline-migrate
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  migrate:
    name: Apply migrations + seed normalization rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ${{ vars.VPS_TAILNET_IP }}
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ vars.DB_NAME || 'warehouse' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Apply scripts/migrate_*.sql over tailnet
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}-worker:develop"

          for f in scripts/migrate_*.sql; do
            echo "Applying ${f}..."
            docker run --rm -i \
              -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASSWORD -e DB_NAME \
              -v "$(pwd)/${f}:/tmp/migrate.sql:ro" \
              --entrypoint psql \
              "${IMAGE}" \
              "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}" \
              -v ON_ERROR_STOP=0 -f /tmp/migrate.sql
          done

      - name: Seed normalization rules (idempotent)
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}-worker:develop"

          docker run --rm \
            -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASSWORD -e DB_NAME \
            "${IMAGE}" \
            python scripts/seed_normalization_rules.py

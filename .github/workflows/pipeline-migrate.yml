name: Pipeline - Migrate & Seed

# Manual/on-demand only: applies scripts/migrate_*.sql against the VPS
# Postgres warehouse and seeds normalization rules. Replaces the old
# deploy-time steps in deploy.yml that used to `docker exec` into the
# talentpulse-prefect-worker container - that container no longer exists
# now that compute moved to GitHub Actions (see docker-compose.yml).
#
# Run this manually after a schema change lands (new migrate_*.sql file) or
# right after the initial cutover, then rely on pipeline-*.yml crons for
# day-to-day runs. Uncomment the schedule block below if you want it to also
# run automatically (e.g. nightly, idempotent SQL/seed so reruns are safe).
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "30 1 * * *"

concurrency:
  group: pipeline-migrate
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  migrate:
    name: Apply migrations + seed normalization rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ${{ vars.WAREHOUSE_TAILNET_IP }}
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ vars.DB_NAME || 'warehouse' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Runs psql on the runner itself, not inside the -worker image - that
      # image (prefecthq/prefect:2.16.5-python3.10 + psycopg2-binary) has no
      # psql binary. Uses discrete -h/-p/-U/-d flags with PGPASSWORD instead
      # of a postgresql:// URI so a password containing URI-special
      # characters (@, :, /, #, etc.) doesn't need manual percent-encoding.
      - name: Apply scripts/migrate_*.sql over tailnet
        run: |
          set -euo pipefail
          for f in scripts/migrate_*.sql; do
            echo "Applying ${f}..."
            # ON_ERROR_STOP=1: every migrate_*.sql is idempotent (IF NOT EXISTS /
            # ADD COLUMN IF NOT EXISTS), so a real error here means the migration
            # is broken, not merely re-applied. With =0 psql swallowed it and the
            # job went green on a half-migrated schema.
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Seed normalization rules (idempotent)
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}-worker:develop"

          docker run --rm \
            -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASSWORD -e DB_NAME \
            "${IMAGE}" \
            python scripts/seed_normalization_rules.py

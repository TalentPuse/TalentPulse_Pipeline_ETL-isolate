name: Pipeline - LinkedIn

# Cron is UTC. "0 6 * * *" UTC == 13:00 Asia/Ho_Chi_Minh (UTC+7).
# Adjust the hour below if you want a different VN local time.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: pipeline-linkedin
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  run:
    name: Run linkedin-pipeline (run-once)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Prefect (VPS, over tailnet)
      PREFECT_API_URL: http://${{ vars.WAREHOUSE_TAILNET_IP }}:4200/api

      # Postgres warehouse (VPS, over tailnet)
      DB_HOST: ${{ vars.WAREHOUSE_TAILNET_IP }}
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ vars.DB_NAME || 'warehouse' }}

      # Cloudflare R2 (S3-compatible raw object storage)
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || 'talentpulse-raw' }}

      # Crawler
      CRAWLER_CONTACT_EMAIL: ${{ vars.CRAWLER_CONTACT_EMAIL }}
      LINKEDIN_KEYWORDS: ${{ vars.LINKEDIN_KEYWORDS || 'Data Engineer,Data Analyst,AI Engineer,Data Scientist,Business Analyst' }}
      LINKEDIN_TITLE_KEYWORDS: ${{ vars.LINKEDIN_TITLE_KEYWORDS || 'Data Engineer,Data Analyst,AI Engineer,Data Scientist,Business Analyst' }}
      LINKEDIN_GEO_ID: ${{ vars.LINKEDIN_GEO_ID || '104195383' }}
      LINKEDIN_RATE_SECONDS: ${{ vars.LINKEDIN_RATE_SECONDS || '3.0' }}
      FOCUS_KEYWORDS: ${{ vars.FOCUS_KEYWORDS || 'data engineer,data analyst,ai,machine learning,data science,data scientist,big data,analytics,business development,business analyst,technical sales' }}
      SKIP_FOCUS_SOURCES: ${{ vars.SKIP_FOCUS_SOURCES || 'itviec' }}

      # linkedin_pipeline's final task calls the dashboard API to dispatch
      # alerts (orchestration/flows/_shared.py::dispatch_dashboard_alerts),
      # tp-backend runs on the WEB box, not this one. Hence a second tailnet
      # variable: WAREHOUSE_TAILNET_IP for postgres/prefect, WEB_TAILNET_IP for
      # the dashboard API. Pointing both at one IP is what coupled them before.
      DASHBOARD_API_URL: http://${{ vars.WEB_TAILNET_IP }}:8001
      ALERT_DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run linkedin-pipeline
        uses: ./.github/actions/run-flow
        with:
          image-suffix: linkedin
          module: orchestration.flows.linkedin_pipeline
          image-tag: develop
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
